<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Student</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Add New Student</h1>
        <p>Enter student details</p>
    </header>

    <main>

        <form action="/add-student" method="POST">

            <div class="form-group">
                <label>Student Name</label>
                <input type="text" name="name" placeholder="Enter student name" required>
            </div>

            <div class="form-group">
                <label>Course</label>
                <input type="text" name="course" placeholder="B.Tech CSE" required>
            </div>

            <div class="form-group">
                <label>Marks</label>
                <input type="number" name="marks" step="0.01" placeholder="Enter marks" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="Enter email" required>
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="phone" placeholder="Enter phone number" required>
            </div>

            <div class="form-group">
                <label>Semester</label>
                <input type="number" name="semester" placeholder="Enter semester" required>
            </div>

            <div class="form-group">
                <label>Section</label>
                <input type="text" name="section" placeholder="Enter section" required>
            </div>

            <div class="form-group">
                <label>Date of Birth</label>
                <input type="date" name="date_of_birth" required>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Attendance (%)</label>
                <input type="number" name="attendance" step="0.01" placeholder="Enter attendance" required>
            </div>

            <div class="form-group">
                <label>Address</label>
                <textarea name="address" placeholder="Enter address" required></textarea>
            </div>

            <button type="submit">Add Student</button>

        </form>

        <br>

        <a href="index.html">← Back to Home</a>

    </main>

</body>

</html>
